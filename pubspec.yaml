publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ^3.11.5

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    flutter_bloc: ^9.0.0
    equatable: ^2.0.5
    go_router: ^14.0.0
