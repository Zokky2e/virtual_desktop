name: virtual_desktop
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ^3.11.5

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    flutter_bloc: ^9.0.0
    equatable: ^2.0.5
    go_router: ^14.0.0
    get_it: ^8.0.0
    dio: ^5.4.0
    firebase_core: ^3.0.0
    firebase_auth: ^5.0.0
    cloud_firestore: ^5.0.0
    firebase_storage: ^12.0.0
    fpdart: ^1.1.0 # or dartz — for Either-based error handling
    uuid: ^4.4.0
    flutter_dotenv: ^5.1.0
    file_picker: ^8.0.0
    web: ^1.1.1
    video_player: ^2.9.0
    audioplayers: ^6.0.0
    flutter_markdown: ^0.7.0
    shared_preferences: ^2.3.0
    flutter_colorpicker: ^1.1.0

    path_provider: ^2.1.0
    path: ^1.9.0

    web_socket_channel: ^3.0.0
    http_parser: ^4.0.2
    url_launcher: ^6.3.2
    # Fork of vlc_player v2.1.2. Upstream's Windows plugin delivers
    # event-channel messages from its polling thread, which the Flutter engine
    # rejects ("sent a message from native to Flutter on a non-platform
    # thread") and which deadlocks against Dispose()'s polling_thread_.join(),
    # hanging the whole app around opening or closing a video.
    #
    # Branch fix/windows-event-channel-platform-thread, based on the v2.1.2
    # tag. Pinned to a commit, not a branch, so builds stay reproducible.
    # Drop the fork and go back to the hosted package if upstream fixes this.
    vlc_player:
        git:
            url: https://github.com/Zokky2e/vlc_player.git
            ref: 26ec2836bc35568c96a6d6ae8389d8e67e2ec1a1
dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    bloc_test: ^10.0.0
    mocktail: ^1.0.3

flutter:
    uses-material-design: true
    assets:
        - .env
